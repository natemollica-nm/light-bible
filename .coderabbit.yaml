language: "en"
reviews:
  profile: "concise"
  high_level_summary: true
  poem: false
  review_status: true
  path_instructions:
    - path: "app/**"
      instructions: "Focus on React Native best practices, accessibility, and Light Phone III design constraints (monochrome, minimal, no animations)."
    - path: "utils/**"
      instructions: "Focus on error handling, caching correctness, and API compliance (especially ESV rate limits and storage guidelines)."
    - path: "components/**"
      instructions: "Focus on component reusability, prop types, and accessibility (touch targets >= 44pt)."
  auto_review:
    enabled: true
    drafts: false
chat:
  auto_reply: true
