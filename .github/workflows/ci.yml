name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/light-gradle.sh :tool:testDebugUnitTest :tool:lintDebug :tool:assembleDebug

  legacy-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: npx eslint .
      - run: npx tsc --noEmit
      - run: npx jest
      - run: node --test scripts/hosted-bible/service.spec.mjs
