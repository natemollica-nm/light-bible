name: Build unsigned Light tool

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build the native tool
        run: ./scripts/light-gradle.sh :tool:testDebugUnitTest :tool:lintRelease :tool:assembleRelease -DlightSdk.unsigned=true
      - uses: actions/upload-artifact@v7
        with:
          name: light-bible-unsigned-not-light-approved
          path: tool/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error

# Distribution is through Light's Dashboard build/sign/review pipeline.
# A local or CI-generated APK is not a Light-signed or Light-approved tool.
